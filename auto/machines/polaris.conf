# Polaris: 4x NVIDIA A100 per node.
ROOT=/grand/catalyst/world-shared/chemgraph
DEVICE=cuda
TORCH_INDEX=https://download.pytorch.org/whl/cu126
THREADS=8
PBS_ACCOUNT=ChemGraph
PBS_QUEUE=debug
# debug allows one queued job per user; fall back when it is taken.
PBS_QUEUE_FALLBACK=debug-scaling
PBS_SELECT=1
PBS_FILESYSTEMS=home:grand
# Waits 30 s for a CLI prompt; a cold import over Lustre takes longer.
PYTEST_ARGS="--deselect tests/test_deep_agent_cli_review.py::test_tty_queued_enters_cannot_approve_next_action"
