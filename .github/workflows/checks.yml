name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline behavior tests
        run: python -m unittest discover -s tests -v
      - name: Bash syntax
        run: |
          for script in machines/*/*.sh; do
            bash -n "$script"
          done
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.12.10 shellcheck-py==0.10.0.1
      - run: ruff check .
      - run: python scripts/check-shell.py
